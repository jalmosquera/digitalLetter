name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://digitalletter-production-d688.up.railway.app/health/)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: backend returned $STATUS"
            exit 1
          fi
